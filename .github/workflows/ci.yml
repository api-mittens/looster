name: Test and release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Go tests and Cobra CLI build
    runs-on: ubuntu-24.04
    env:
      CGO_ENABLED: '1'
      CC: '${{ github.workspace }}/scripts/static-cxx-cc.sh'
      CGO_LDFLAGS: '-static-libgcc'
      LOOSTER_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/looster_test?sslmode=disable
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: looster_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d looster_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify modules and license inventory
        run: |
          go mod verify
          bash scripts/static-cxx-cc_test.sh
          bash scripts/check-native-deps_test.sh
          bash scripts/check-release-archives_test.sh
          bash scripts/package-runtime-notices_test.sh
          go run ./scripts/licenses -check
      - name: Build Cobra CLI and check native dependencies
        run: |
          go build -trimpath -o bin/looster ./cmd/looster
          bash scripts/check-native-deps.sh bin/looster linux
          bin/looster --help
      - name: Test frontend state and pagination
        run: node --test internal/web/static/*.test.mjs
      - name: Configure browser acceptance tests
        shell: bash
        run: |
          set -euo pipefail
          browser=$(command -v google-chrome)
          echo "CHROMIUM=$browser" >> "$GITHUB_ENV"
          echo "LOOSTER_TEST_BINARY=$GITHUB_WORKSPACE/bin/looster" >> "$GITHUB_ENV"
      - name: Start disposable S3 storage
        shell: bash
        run: |
          set -euo pipefail
          # Pinned official release artifact. Never use the retired moving dl.min.io URL.
          curl --fail --location --output "$RUNNER_TEMP/minio" https://github.com/minio/minio/releases/download/RELEASE.2025-09-07T16-13-09Z/minio.linux-amd64.RELEASE.2025-09-07T16-13-09Z
          echo "7c5bd8512c6e966455b1d198209358b2d191c77a83ab377c4073281065fb855f  $RUNNER_TEMP/minio" | sha256sum --check
          chmod 700 "$RUNNER_TEMP/minio"
          MINIO_ROOT_USER=looster-test MINIO_ROOT_PASSWORD=looster-test-password "$RUNNER_TEMP/minio" server "$RUNNER_TEMP/minio-data" --address 127.0.0.1:9000 > "$RUNNER_TEMP/minio.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:9000/minio/health/ready
          curl --fail --silent --aws-sigv4 'aws:amz:us-east-1:s3' --user 'looster-test:looster-test-password' --request PUT http://127.0.0.1:9000/looster-test
          echo 'LOOSTER_S3_ENDPOINT=http://127.0.0.1:9000' >> "$GITHUB_ENV"
          echo 'LOOSTER_S3_BUCKET=looster-test' >> "$GITHUB_ENV"
          echo 'LOOSTER_S3_ACCESS_KEY=looster-test' >> "$GITHUB_ENV"
          echo 'LOOSTER_S3_SECRET_KEY=looster-test-password' >> "$GITHUB_ENV"
      - name: Run all Go tests, including PostgreSQL and browser integration tests
        env:
          LOOSTER_BROWSER_TEST: '1'
          LOOSTER_PRODUCTION_TEST: '1'
          LOOSTER_STORAGE_ACCEPTANCE: 'yes'
          LOOSTER_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          LOOSTER_TEST_S3_BUCKET: looster-test
          LOOSTER_TEST_S3_ACCESS_KEY: looster-test
          LOOSTER_TEST_S3_SECRET_KEY: looster-test-password
        run: go test -count=1 -timeout=10m ./...
      - name: Verify embedded DuckLake with isolated PostgreSQL and S3 fixtures
        shell: bash
        run: |
          set -euo pipefail
          pg_bin=/usr/lib/postgresql/16/bin
          if [[ ! -x "$pg_bin/initdb" ]]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-16
          fi
          export LOOSTER_TEST_PG_BIN="$pg_bin"
          export JCODE_SCRATCH_DIR="$RUNNER_TEMP/ducklake-fixtures"
          bash scripts/test-ducklake.sh
      - name: Test incremental lint diagnostic comparison
        working-directory: scripts/lint-audit
        run: go test ./...
      - name: Vet
        run: go vet ./...

  # Build every supported platform on PRs, not just tags. CGO cannot be disabled
  # or naively cross-compiled. Windows is not supported.
  build:
    name: Static DuckDB ${{ matrix.os }}/${{ matrix.arch }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: linux, arch: amd64, runner: ubuntu-24.04, shell: bash}
          - {os: linux, arch: arm64, runner: ubuntu-24.04-arm, shell: bash}
          - {os: darwin, arch: amd64, runner: macos-15-intel, shell: bash}
          - {os: darwin, arch: arm64, runner: macos-15, shell: bash}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Force Linux explicit C++ libraries to static archives
        if: matrix.os == 'linux'
        run: |
          echo "CC=$GITHUB_WORKSPACE/scripts/static-cxx-cc.sh" >> "$GITHUB_ENV"
          echo 'CGO_LDFLAGS=-static-libgcc' >> "$GITHUB_ENV"
      - name: Build, inspect, smoke-test and package
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.0.0-ci' }}
        run: bash scripts/release-archive.sh '${{ matrix.os }}' '${{ matrix.arch }}' "$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish tagged binaries
    needs: [test, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Require all four archives and checksum their published bytes
        shell: bash
        run: |
          bash scripts/check-release-archives.sh dist "$RELEASE_TAG"
      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          prerelease=()
          version=${RELEASE_TAG%%+*}
          if [[ "$version" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes "${prerelease[@]}"
