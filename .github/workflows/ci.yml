name: Test and release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Go tests and Cobra CLI build
    runs-on: ubuntu-24.04
    env:
      CGO_ENABLED: '1'
      CC: '${{ github.workspace }}/scripts/static-cxx-cc.sh'
      CGO_LDFLAGS: '-static-libgcc'
      LOOSTER_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/looster_test?sslmode=disable
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: looster_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d looster_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify modules and license inventory
        run: |
          go mod verify
          bash scripts/static-cxx-cc_test.sh
          bash scripts/check-native-deps_test.sh
          bash scripts/package-runtime-notices_test.sh
          go run ./scripts/licenses -check
      - name: Build Cobra CLI and check native dependencies
        run: |
          go build -trimpath -o bin/looster ./cmd/looster
          bash scripts/check-native-deps.sh bin/looster linux
          bin/looster --help
      - name: Configure browser acceptance tests
        shell: bash
        run: |
          set -euo pipefail
          browser=$(command -v google-chrome)
          echo "CHROMIUM=$browser" >> "$GITHUB_ENV"
          echo "LOOSTER_TEST_BINARY=$GITHUB_WORKSPACE/bin/looster" >> "$GITHUB_ENV"
      - name: Run all Go tests, including PostgreSQL and browser integration tests
        env:
          LOOSTER_BROWSER_TEST: '1'
          LOOSTER_PRODUCTION_TEST: '1'
        run: go test -count=1 -timeout=10m ./...
      - name: Verify embedded DuckLake with isolated PostgreSQL and S3 fixtures
        shell: bash
        run: |
          set -euo pipefail
          pg_bin=/usr/lib/postgresql/16/bin
          if [[ ! -x "$pg_bin/initdb" ]]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-16
          fi
          export LOOSTER_TEST_PG_BIN="$pg_bin"
          export JCODE_SCRATCH_DIR="$RUNNER_TEMP/ducklake-fixtures"
          bash scripts/test-ducklake.sh
      - name: Test incremental lint diagnostic comparison
        working-directory: scripts/lint-audit
        run: go test ./...
      - name: Vet
        run: go vet ./...

  # Build every supported platform on PRs, not just tags. CGO cannot be disabled
  # or naively cross-compiled. The sixth target is an explicit source build.
  build:
    name: Static DuckDB ${{ matrix.os }}/${{ matrix.arch }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: linux, arch: amd64, runner: ubuntu-24.04, shell: bash}
          - {os: linux, arch: arm64, runner: ubuntu-24.04-arm, shell: bash}
          - {os: darwin, arch: amd64, runner: macos-15-intel, shell: bash}
          - {os: darwin, arch: arm64, runner: macos-15, shell: bash}
          - {os: windows, arch: amd64, runner: windows-2025, shell: 'msys2 {0}', msystem: MSYS, packages: 'zip curl'}
          - {os: windows, arch: arm64, runner: windows-11-arm, shell: 'msys2 {0}', msystem: CLANGARM64, packages: 'mingw-w64-clang-aarch64-toolchain mingw-w64-clang-aarch64-cmake mingw-w64-clang-aarch64-ninja mingw-w64-clang-aarch64-python git zip'}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up native Windows GNU toolchain
        if: matrix.os == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: ${{ matrix.packages }}
          path-type: inherit
      - name: Pin Windows AMD64 compiler to official archive ABI
        if: matrix.os == 'windows' && matrix.arch == 'amd64'
        run: bash scripts/setup-duckdb-windows-amd64.sh
      - name: Force Linux explicit C++ libraries to static archives
        if: matrix.os == 'linux'
        run: |
          echo "CC=$GITHUB_WORKSPACE/scripts/static-cxx-cc.sh" >> "$GITHUB_ENV"
          echo 'CGO_LDFLAGS=-static-libgcc' >> "$GITHUB_ENV"
      - name: Link Windows AMD64 compiler runtimes statically
        if: matrix.os == 'windows' && matrix.arch == 'amd64'
        run: echo 'CGO_LDFLAGS=-static -static-libgcc' >> "$GITHUB_ENV"
      - name: Build matching static DuckDB for Windows ARM64
        if: matrix.os == 'windows' && matrix.arch == 'arm64'
        run: bash scripts/build-duckdb-windows-arm64.sh
      - name: Build, inspect, smoke-test and package
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.0.0-ci' }}
        run: bash scripts/release-archive.sh '${{ matrix.os }}' '${{ matrix.arch }}' "$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish tagged binaries
    needs: [test, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Require all six archives and checksum their published bytes
        shell: bash
        run: |
          set -euo pipefail
          for target in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64 windows_amd64 windows_arm64; do
            suffix=tar.gz
            if [[ "$target" == windows_* ]]; then suffix=zip; fi
            test -s "dist/looster_${RELEASE_TAG}_${target}.${suffix}"
          done
          [[ $(find dist -maxdepth 1 -type f | wc -l) -eq 6 ]]
          (cd dist && sha256sum *.tar.gz *.zip > checksums.txt)
      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          prerelease=()
          version=${RELEASE_TAG%%+*}
          if [[ "$version" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes "${prerelease[@]}"
