[env]
_.file = { path = ".env", redact = true }

[tools]
go = "1.27.2"
golangci-lint = "2.15.0"
sqlc = "1.31.1"
"go:github.com/pressly/goose/v3/cmd/goose" = "3.27.3"

[tasks.generate]
description = "Generate PostgreSQL query bindings"
run = "sqlc generate"

[tasks.build]
description = "Build Looster (works before git is initialized)"
run = "go build -buildvcs=false -o bin/looster ./cmd/looster"

[tasks.test]
description = "Run unit tests"
run = "go test ./..."

[tasks.lint]
description = "Lint new changes against HEAD (use golangci-lint run for a full audit)"
run = "golangci-lint run --new-from-rev=HEAD ./..."

[tasks."hooks:install"]
description = "Install repository hooks (review existing core.hooksPath first)"
run = "git config --local core.hooksPath scripts"

[tasks."hooks:test"]
description = "Run isolated pre-commit regression tests and audit helper unit tests"
run = "bash scripts/pre-commit_test.sh && (cd scripts/lint-audit && go test ./...)"

[tasks."hooks:test-real"]
description = "Run real-linter autofix and declaration-boundary regressions"
run = "bash scripts/pre-commit_test.sh --real && bash scripts/pre-commit_declarations_test.sh && (cd scripts/lint-audit && go test ./... -args -real-linter=golangci-lint)"
