services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: looster
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d looster"]
      interval: 2s
      timeout: 3s
      retries: 30
  s3:
    image: localstack/localstack:4.8
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - ./dev/s3-init.sh:/etc/localstack/init/ready.d/01-bucket.sh:ro
    healthcheck:
      test: ["CMD", "awslocal", "s3api", "head-bucket", "--bucket", "looster"]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  postgres-data:
